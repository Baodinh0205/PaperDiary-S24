name: Build Paper Diary APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "PaperDiary-Native-S24.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q PaperDiary-Native-S24.zip -d build-src
          test -f build-src/PaperDiary-Native-S24/settings.gradle
          test -f build-src/PaperDiary-Native-S24/app/build.gradle

      - name: Build debug APK
        working-directory: build-src/PaperDiary-Native-S24
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature
        run: |
          APK="build-src/PaperDiary-Native-S24/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" PaperDiary-S24.apk
          sha256sum PaperDiary-S24.apk | tee PaperDiary-S24.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperDiary-S24-APK
          path: |
            PaperDiary-S24.apk
            PaperDiary-S24.sha256
          if-no-files-found: error
          retention-days: 30
